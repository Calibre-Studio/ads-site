<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChatGPT Ads OG card</title>
<style>
  html,body{margin:0;padding:0;background:#0a0a0a}
  /* The card is exactly 1200x630. Screenshot / capture this .canvas element for the OG image. */
  .canvas{
    width:1200px;height:630px;background:#0a0a0a;
    display:flex;align-items:center;justify-content:center;
    font-family:Helvetica,Arial,sans-serif;overflow:hidden;
  }
  .card{
    width:980px;height:430px;background:#fff;border:1px solid #e9e9e9;
    box-sizing:border-box;padding:54px 60px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .eyebrow{display:flex;align-items:center;gap:16px;
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#6f6f6f;}
  .eyebrow img{height:34px;width:34px;display:block;border-radius:3px}
  .headline{margin:0;font-family:Helvetica,Arial,sans-serif;font-weight:800;
    color:#0f0f0f;font-size:82px;line-height:1.02;letter-spacing:-.035em;}
  .foot{display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid #ececec;padding-top:28px;}
  .domain{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:22px;letter-spacing:.01em;color:#0f0f0f;}
  .wordmark{height:26px;width:auto;display:block}
</style>
</head>
<body>
  <div class="canvas">
    <div class="card">
      <div class="eyebrow"><img src="https://cdn.calibrestudio.co/Branding/CALIBRE-ICON-BLK.png" alt="//">ChatGPT Ads</div>
      <h1 class="headline">Be the answer<br>inside ChatGPT.</h1>
      <div class="foot">
        <span class="domain">ads.calibrestudio.co</span>
        <img class="wordmark" src="https://cdn.calibrestudio.co/Branding/Calibre_Studio-logo.png" alt="Calibre Studio">
      </div>
    </div>
  </div>
</body>
</html>
